name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle to dist/
        run: npm run build

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy native Kotlin Overlay files, launcher icons & clean splash screen
        run: |
          mkdir -p android/app/src/main/java/com/midweek/meetingtimer
          cp android-template/MainActivity.kt android/app/src/main/java/com/midweek/meetingtimer/MainActivity.kt
          cp android-template/OverlayPlugin.kt android/app/src/main/java/com/midweek/meetingtimer/OverlayPlugin.kt
          cp android-template/OverlayService.kt android/app/src/main/java/com/midweek/meetingtimer/OverlayService.kt
          cp android-template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          if [ -d "android-template/res" ]; then
            rm -rf android/app/src/main/res/mipmap-*
            cp -r android-template/res/* android/app/src/main/res/
          fi
          rm -f android/app/src/main/res/drawable*/splash.png
          mkdir -p android/app/src/main/res/drawable
          printf '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://android.com" android:shape="rectangle">\n    <solid android:color="#080f1f" />\n</shape>\n' > android/app/src/main/res/drawable/splash.xml
          rm -f android/app/src/main/java/com/midweek/meetingtimer/MainActivity.java

      - name: Enable Kotlin & Native Offline ML Kit OCR in Android Gradle
        run: |
          node -e '
            const fs = require("fs");

            // 1. Add kotlin-gradle-plugin to android/build.gradle
            let rootGradle = fs.readFileSync("android/build.gradle", "utf8");
            if (!rootGradle.includes("kotlin-gradle-plugin")) {
              rootGradle = rootGradle.replace(
                /dependencies\s*\{/,
                "dependencies {\n        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.10\""
              );
              fs.writeFileSync("android/build.gradle", rootGradle);
            }

            // 2. Apply kotlin-android plugin, JVM 21 target, and bundled offline ML Kit Text Recognition in android/app/build.gradle
            let appGradle = fs.readFileSync("android/app/build.gradle", "utf8");
            if (!appGradle.includes("kotlin-android")) {
              if (appGradle.includes("apply plugin: '\''com.android.application'\''")) {
                appGradle = appGradle.replace(
                  "apply plugin: '\''com.android.application'\''",
                  "apply plugin: '\''com.android.application'\''\napply plugin: '\''kotlin-android'\''"
                );
              } else {
                appGradle = "apply plugin: '\''kotlin-android'\''\n" + appGradle;
              }
            }
            if (!appGradle.includes("kotlinOptions")) {
              appGradle += "\nandroid {\n    kotlinOptions {\n        jvmTarget = '\''21'\''\n    }\n}\n";
            }
            if (!appGradle.includes("com.google.mlkit:text-recognition")) {
              appGradle = appGradle.replace(
                /dependencies\s*\{/,
                "dependencies {\n    implementation '\''com.google.mlkit:text-recognition:16.0.1'\''"
              );
            }
            fs.writeFileSync("android/app/build.gradle", appGradle);
          '

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Midweek-Timer-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
